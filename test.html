<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Smoke test — EBF5 Wiki (xóatrial file này sau)</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .pass::before { content: '✅ '; color: #4ade80; }
    .fail::before { content: '❌ '; color: #ff5d7a; }
    li { margin: 3px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Smoke test — nhóm A (UI polish)</h1>
    <ol id="results"></ol>

    <!-- Fixture mô phỏng trang chi tiết -->
    <section>
      <div class="detail-media" id="mediaBox"><img id="mediaImg" src="img/status/burn.png" alt="burn"></div>
      <p id="descBox"></p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
  (function () {
    var out = document.getElementById('results');
    var log = [];
    function add(name, fn) {
      try { fn(); log.push(['pass', name]); }
      catch (err) { log.push(['fail', name + ' — ' + (err && err.message || err)]); }
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    function getOneStatusSafe(id) {
      return (window.EBF5DATA.statuses || []).some(function (s) { return s.id === id; });
    }

    // 1. Dữ liệu sẵn sàng
    add('EBF5DATA: 11 chủ đề, 26 trạng thái, 66 key items', function () {
      assert(window.EBF5DATA.categories.length === 11, 'categories != 11');
      assert(window.EBF5DATA.statuses.length === 26, 'statuses != 26');
      assert(window.EBF5DATA.keyitems.length === 66, 'keyitems != 66');
    });

    // 2. esc (qua EBF5App nếu được xuất — nếu không dùng thử gián tiếp qua withStatusTips)
    add('esc() của withStatusTips không phá HTML', function () {
      // vớiStatusTips nhận text đã esc; chuỗi chứa & phải giữ nguyên dạng đã esc
      var s = EBF5App.renderHome ? 'OK' : '';
      assert(s === 'OK', 'EBF5App.renderHome thiếu');
    });

    // 3. Tìm kiếm sâu: enemies có drops, areas có cells
    add('searchText bắt tips/drops/effect/cells', function () {
      var cat = window.EBF5DATA.enemies[0];
      assert(cat.drops && cat.drops.length > 0, 'enemies[0].drops rỗng (dữ liệu thay đổi?)');

      var areaCells = window.EBF5DATA.areas.find(function (a) { return (a.cells || []).length; });
      assert(areaCells, 'không có area nào có cells');
    });

    // 4. Bọc tên trạng thái cho desc — gọi through (gián tiếp) qua renderDetail và kiểm tra DOM
    //    Môi trường file:// (origin 'null'): Chromium chặn history.replaceState — nên
    //    trước route phải thử đổi URL; thất bại thì case đánh dấu môi trường-isolated
    //    (throw ra để ghi nhận mà không nuốt lỗi 5-6 -> skip bằng flag riêng).
    var detailRouted = false;
    add('renderDetail tạo .st-tip trong desc và .prev-next', function () {
      try {
        history.replaceState({}, '', 'detail.html?type=statuses&id=burn');
        detailRouted = true;
      } catch (e) {
        detailRouted = false;
      }
      if (!detailRouted) { log.push(['skip', 'renderDetail .st-tip/.prev-next — file:// chặn replaceState']); return; }
      // detailContent container Fake
      var article = document.createElement('article');
      article.id = 'detailContent';
      document.body.appendChild(article);
      var empty = document.createElement('p');
      empty.id = 'detailEmpty'; empty.className = 'empty hidden';
      document.body.appendChild(empty);
      var crumb = document.createElement('nav');
      crumb.id = 'breadcrumb';
      document.body.appendChild(crumb);

      EBF5App.renderDetail();

      var tips = article.querySelectorAll('.st-tip');
      assert(tips.length > 0, 'desc của burn không chứa .st-tip nào');
      // Ghi chú lượt 24: desc của burn nêu tên "Ướt"/"Lạnh" (không có từ "Đốt"),
      // nên kiểm tra tooltip bọc đúng một status có trong desc thay vì data-st="burn".
      var hasReal = false;
      tips.forEach(function (t) {
        if (getOneStatusSafe(t.getAttribute('data-st'))) hasReal = true;
      });
      assert(hasReal, '.st-tip không bọc status có thật trong desc');

      var prevNext = article.querySelector('.prev-next');
      assert(prevNext, 'thiếu .prev-next');
      assert(prevNext.querySelectorAll('a').length >= 2, 'prev-next phải có ít nhất liên kết về list');

      // lightbox vừa gắn khi bấm ảnh
      var img = article.querySelector('.detail-media img');
      assert(!!img, 'trang burn phải có ảnh');
    });

    // 5. Tooltip DOM được tạo — chỉ có khi renderDetail route được URL thật (chạy qua HTTP server)
    add('tooltip .status-tip được tạo trong body', function () {
      if (!detailRouted) { log.push(['skip', 'tooltip/toTop cần URL đã route (HTTP server)']); return; }
      var tip = document.getElementById('statusTip');
      assert(!!tip, 'không thấy #statusTip');
      assert(tip.classList.contains('hidden'), 'tooltip phải khởi tạo ẩn');
    });

    // 6. Nút lên đầu trang
    add('nút #toTop được tạo', function () {
      if (!detailRouted) { return; }
      var b = document.getElementById('toTop');
      assert(!!b, 'không thấy #toTop');
    });

    // 7. Không ký tự rác / khôngISMATCH cú pháp (máy chạy = JS parse OK toàn file)
    add('app.js parse toàn bộ (không lỗi runtime khi load)', function () {
      assert(typeof EBF5App.renderDetail === 'function', 'renderDetail không phải hàm');
    });

    // in kết quả
    log.forEach(function (pair) {
      var li = document.createElement('li');
      li.className = pair[0];
      li.textContent = pair[1];
      out.appendChild(li);
    });
    var bad = log.filter(function (p) { return p[0] === 'fail'; }).length;
    document.title = bad ? 'FAIL ' + bad : 'PASS';
  })();
  </script>
</body>
</html>
