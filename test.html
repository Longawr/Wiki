<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Smoke test — EBF5 Wiki (xóatrial file này sau)</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .pass::before { content: '✅ '; color: #4ade80; }
    .fail::before { content: '❌ '; color: #ff5d7a; }
    li { margin: 3px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Smoke test — nhóm A (UI polish)</h1>
    <ol id="results"></ol>

    <!-- Fixture mô phỏng trang chi tiết -->
    <section>
      <div class="detail-media" id="mediaBox"><img id="mediaImg" src="img/status/burn.png" alt="burn"></div>
      <p id="descBox"></p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
  (function () {
    var out = document.getElementById('results');
    var log = [];
    function add(name, fn) {
      try { fn(); log.push(['pass', name]); }
      catch (err) { log.push(['fail', name + ' — ' + (err && err.message || err)]); }
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    function getOneStatusSafe(id) {
      return (window.EBF5DATA.statuses || []).some(function (s) { return s.id === id; });
    }

    // 1. Dữ liệu sẵn sàng — assert đủ 11 chủ đề (lượt 29: khớp check.ps1, tổng 1144)
    add('EBF5DATA: 11 chủ đề đủ bộ (216 foe / 183 skill / 46 item / 60 material / 228 trang bị / 48 status / 81 khu / 66 key / 191 summon / 20 LB) — tổng 1144', function () {
      var d = window.EBF5DATA;
      assert(d.categories.length === 11, 'categories != 11');
      assert(d.characters.length === 5, 'characters != 5 (là ' + d.characters.length + ')');
      assert(d.enemies.length === 216, 'enemies != 216 (là ' + d.enemies.length + ')');
      assert(d.skills.length === 183, 'skills != 183 (là ' + d.skills.length + ')');
      assert(d.items.length === 46, 'items != 46 (là ' + d.items.length + ')');
      assert(d.materials.length === 60, 'materials != 60 (là ' + d.materials.length + ')');
      assert(d.equipment.length === 228, 'equipment != 228 (là ' + d.equipment.length + ')');
      assert(d.statuses.length === 48, 'statuses != 48');
      assert(d.areas.length === 81, 'areas != 81 (là ' + d.areas.length + ')');
      assert(d.keyitems.length === 66, 'keyitems != 66');
      assert(d.summons.length === 191, 'summons != 191 (là ' + d.summons.length + ')');
      assert(d.limits.length === 20, 'limits != 20 (là ' + d.limits.length + ')');
      var total = ['characters', 'enemies', 'skills', 'items', 'materials', 'equipment', 'statuses', 'areas', 'keyitems', 'summons', 'limits']
        .reduce(function (s, k) { return s + d[k].length; }, 0);
      assert(total === 1144, 'tổng mục != 1144 (là ' + total + ')');
    });

    // 2. esc (qua EBF5App nếu được xuất — nếu không dùng thử gián tiếp qua withStatusTips)
    add('esc() của withStatusTips không phá HTML', function () {
      // vớiStatusTips nhận text đã esc; chuỗi chứa & phải giữ nguyên dạng đã esc
      var s = EBF5App.renderHome ? 'OK' : '';
      assert(s === 'OK', 'EBF5App.renderHome thiếu');
    });

    // 3. Tìm kiếm sâu: enemies có drops, areas có cells
    add('searchText bắt tips/drops/effect/cells', function () {
      var cat = window.EBF5DATA.enemies[0];
      assert(cat.drops && cat.drops.length > 0, 'enemies[0].drops rỗng (dữ liệu thay đổi?)');

      var areaCells = window.EBF5DATA.areas.find(function (a) { return (a.cells || []).length; });
      assert(areaCells, 'không có area nào có cells');
    });

    // 4. Bọc tên trạng thái cho desc — gọi through (gián tiếp) qua renderDetail và kiểm tra DOM
    //    Môi trường file:// (origin 'null'): Chromium chặn history.replaceState — nên
    //    trước route phải thử đổi URL; thất bại thì case đánh dấu môi trường-isolated
    //    (throw ra để ghi nhận mà không nuốt lỗi 5-6 -> skip bằng flag riêng).
    var detailRouted = false;
    add('renderDetail tạo .st-tip trong desc và .prev-next', function () {
      try {
        history.replaceState({}, '', 'detail.html?type=statuses&id=burn');
        detailRouted = true;
      } catch (e) {
        detailRouted = false;
      }
      if (!detailRouted) { log.push(['skip', 'renderDetail .st-tip/.prev-next — file:// chặn replaceState']); return; }
      // detailContent container Fake
      var article = document.createElement('article');
      article.id = 'detailContent';
      document.body.appendChild(article);
      var empty = document.createElement('p');
      empty.id = 'detailEmpty'; empty.className = 'empty hidden';
      document.body.appendChild(empty);
      var crumb = document.createElement('nav');
      crumb.id = 'breadcrumb';
      document.body.appendChild(crumb);

      EBF5App.renderDetail();

      var tips = article.querySelectorAll('.st-tip');
      assert(tips.length > 0, 'desc của burn không chứa .st-tip nào');
      // Ghi chú lượt 24: desc của burn nêu tên "Ướt"/"Lạnh" (không có từ "Đốt"),
      // nên kiểm tra tooltip bọc đúng một status có trong desc thay vì data-st="burn".
      var hasReal = false;
      tips.forEach(function (t) {
        if (getOneStatusSafe(t.getAttribute('data-st'))) hasReal = true;
      });
      assert(hasReal, '.st-tip không bọc status có thật trong desc');

      var prevNext = article.querySelector('.prev-next');
      assert(prevNext, 'thiếu .prev-next');
      assert(prevNext.querySelectorAll('a').length >= 2, 'prev-next phải có ít nhất liên kết về list');

      // lightbox vừa gắn khi bấm ảnh
      var img = article.querySelector('.detail-media img');
      assert(!!img, 'trang burn phải có ảnh');
    });

    // 5. Tooltip DOM được tạo — chỉ có khi renderDetail route được URL thật (chạy qua HTTP server)
    add('tooltip .status-tip được tạo trong body', function () {
      if (!detailRouted) { log.push(['skip', 'tooltip/toTop cần URL đã route (HTTP server)']); return; }
      var tip = document.getElementById('statusTip');
      assert(!!tip, 'không thấy #statusTip');
      assert(tip.classList.contains('hidden'), 'tooltip phải khởi tạo ẩn');
    });

    // 6. Nút lên đầu trang
    add('nút #toTop được tạo', function () {
      if (!detailRouted) { return; }
      var b = document.getElementById('toTop');
      assert(!!b, 'không thấy #toTop');
    });

    // 7. Chạy được toàn bộ script (máy chạy = JS parse OK toàn file)
    add('app.js parse toàn bộ (không lỗi runtime khi load)', function () {
      assert(typeof EBF5App.renderDetail === 'function', 'renderDetail không phải hàm');
    });

    // 8. Ô lưới khu vực (luot 28): 18 khu chính/trả phí + 63 khu con, 205 ô
    add('areas: 18 khu chính + 63 khu con, Crystal Caverns đủ D0/D1/I9, 205 ô', function () {
      var areas = window.EBF5DATA.areas;
      assert(areas.length === 81, 'areas != 81 (là ' + areas.length + ')');
      var main = areas.filter(function (a) { return a.kind !== 'Khu con'; });
      assert(main.length === 18, 'khu chính/trả phí != 18 (là ' + main.length + ')');
      var cry = areas.find(function (a) { return a.id === 'crystal-caverns'; });
      assert(!!cry, 'thiếu khu crystal-caverns');
      var grids = (cry.cells || []).map(function (c) { return c.grid; }).join(',');
      assert(grids === 'D0,D1,I9', 'cells của crystal-caverns tăng: ' + grids);
      assert(cry.cells.every(function (c) { return c.foes && c.foes.length > 0; }), 'cell crystal thiếu foes');
      var src = window.EBF5DATA.sources && window.EBF5DATA.sources.areaCells;
      assert(!!src && !!src['crystal-caverns'], 'thiếu sources.areaCells[crystal-caverns]');
      Object.keys(src['crystal-caverns']).forEach(function (g) {
        assert(/^Epic Battle Fantasy 5 Map\/[A-Z]\d{1,2} /.test(src['crystal-caverns'][g]), 'title mapping lạ: ' + g);
      });
      var content = 0;
      var totalCells = 0;
      areas.forEach(function (a) {
        (a.cells || []).forEach(function (c) {
          totalCells++;
          if ((c.foes && c.foes.length) || (c.keys && c.keys.length)) content++;
        });
      });
      assert(totalCells === 205, 'tổng ô lưới != 205 (là ' + totalCells + ')');
      assert(content === 195, 'ô có nội dung != 195 (là ' + content + ')');
      // ô mới phải có nội dung đọc được: mỗi foes entry bắt đầu bằng "<cột> - " hoặc em dash
      cry.cells.forEach(function (c) {
        c.foes.forEach(function (f) {
          assert(/^[A-Z] \d{1,2} [-\u2014] /.test(f), 'foes của ' + c.grid + ' thiếu "<cột> - ": ' + f.slice(0, 30));
        });
      });
    });

    // 9. Khu con (luot 28): 63 entry / 84 cell, parent + ảnh map + areaCells
    add('khu con: 63 entry / 84 cell, parent hợp lệ, ảnh map và areaCells đủ', function () {
      var areas = window.EBF5DATA.areas;
      var subs = areas.filter(function (a) { return a.kind === 'Khu con'; });
      assert(subs.length === 63, 'khu con != 63 (là ' + subs.length + ')');
      assert(areas.filter(function (a) { return a.parent; }).length === 63, 'entry có parent != 63');
      var subCells = 0;
      subs.forEach(function (a) {
        assert(!!areas.find(function (p) { return p.id === a.parent; }), 'parent không tồn tại: ' + a.id + ' -> ' + a.parent);
        (a.cells || []).forEach(function (c) {
          subCells++;
          assert(!!c.image && /^img\/areas\//.test(c.image), 'cell thiếu ảnh map: ' + a.id + '/' + c.grid);
        });
        assert((a.cells || []).length > 0, 'khu con không có cell: ' + a.id);
      });
      assert(subCells === 84, 'cell khu con != 84 (là ' + subCells + ')');
      var ice = areas.find(function (a) { return a.id === 'ice-cave'; });
      assert(ice && ice.cells.length === 3, 'ice-cave không đủ 3 ô');
      assert(ice.cells.map(function (c) { return c.grid; }).join(',') === 'D4,D5,E3', 'ice-cave sai ô');
      assert(areas.find(function (a) { return a.id === 'library'; }).cells.length === 4, 'library != 4 ô');
      assert(areas.find(function (a) { return a.id === 'lava-lake'; }).cells.length === 6, 'lava-lake != 6 ô');
      assert(areas.find(function (a) { return a.id === 'data-bunker'; }).cells.length === 3, 'data-bunker != 3 ô');
      assert(areas.find(function (a) { return a.id === 'battle-arena'; }).cells.length === 2, 'battle-arena != 2 ô');
      assert(areas.find(function (a) { return a.id === 'the-beyond'; }).cells.length === 3, 'the-beyond != 3 ô');
      assert(subs.filter(function (a) { return /^Arcade Room/.test(a.name); }).length === 10, 'Arcade Room != 10 entry');
      assert(!!areas.find(function (a) { return a.id === 'food-shop-1st-floor'; }), 'thiếu food-shop-1st-floor');
      assert(!areas.find(function (a) { return a.name === '60 Medals Room (v2)'; }), 'còn entry 60 Medals Room (v2)');
      var src = window.EBF5DATA.sources && window.EBF5DATA.sources.areaCells;
      assert(!!src, 'thiếu sources.areaCells');
      assert(Object.keys(src).length === 81, 'areaCells block != 81');
      var pairCount = 0;
      Object.keys(src).forEach(function (id) { pairCount += Object.keys(src[id]).length; });
      assert(pairCount === 205, 'areaCells pair != 205 (là ' + pairCount + ')');
      subs.forEach(function (a) {
        assert(!!src[a.id], 'thiếu areaCells cho ' + a.id);
        a.cells.forEach(function (c) {
          assert(!!src[a.id][c.grid], 'thiếu areaCells ' + a.id + '/' + c.grid);
        });
      });
      assert(!areas.find(function (a) { return a.id === 'hope-harbor'; }).cells.some(function (c) { return c.grid === 'E3'; }), 'Hope Harbor còn ô E3');
      assert(!areas.find(function (a) { return a.id === 'grand-gallery'; }).cells.some(function (c) { return c.grid === 'A0'; }), 'Grand Gallery còn ô A0');
      assert(!areas.find(function (a) { return a.id === 'the-rapture'; }).cells.some(function (c) { return c.grid === 'J7'; }), 'The Rapture còn ô J7');
      var subsText = areas.some(function (a) { return (a.cells || []).some(function (c) { return !!c.subs; }); });
      assert(!subsText, 'còn cell dùng trường subs');
    });

    // in kết quả
    log.forEach(function (pair) {
      var li = document.createElement('li');
      li.className = pair[0];
      li.textContent = pair[1];
      out.appendChild(li);
    });
    var bad = log.filter(function (p) { return p[0] === 'fail'; }).length;
    document.title = bad ? 'FAIL ' + bad : 'PASS';
  })();
  </script>
</body>
</html>
